<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สายใยตระกูล - แผนผังครอบครัว</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a3b34;
            --bg-darker: #142b26;
            --bg-card: #2a4f46;
            --bg-panel: rgba(255, 255, 255, 0.08);
            --accent: #d4785a;
            --accent-light: #e89473;
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.12);
            --male: #5b9bd5;
            --female: #e07a8a;
            --line: #d4785a;
        }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(20, 43, 38, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--accent-light);
            border: 2px solid var(--accent);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 280px;
            padding: 10px 16px 10px 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
        }

        /* Main Canvas Area */
        .main {
            position: fixed;
            top: 70px;
            left: 0;
            right: 320px;
            bottom: 0;
            overflow: hidden;
            cursor: grab;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 120, 90, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(91, 155, 213, 0.06) 0%, transparent 40%),
                var(--bg-dark);
        }

        .main:active {
            cursor: grabbing;
        }

        #tree-canvas {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* Person Node */
        .node {
            position: absolute;
            width: 180px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .node:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-light);
        }

        .node.highlighted {
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.3);
        }

        .node-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .node-avatar.male { background: linear-gradient(135deg, var(--male), #3a7ab8); }
        .node-avatar.female { background: linear-gradient(135deg, var(--female), #c45a6a); }

        .node-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .node-years {
            font-size: 12px;
            color: var(--text-muted);
        }

        .node-badges {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .badge.spouse-count {
            background: rgba(212, 120, 90, 0.2);
            color: var(--accent-light);
        }

        /* Connection Lines */
        svg.connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .connection-line {
            fill: none;
            stroke: var(--line);
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .connection-line.dashed {
            stroke-dasharray: 8, 6;
            opacity: 0.6;
        }

        /* Union Node */
        .union-node {
            position: absolute;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            z-index: 5;
            box-shadow: 0 2px 10px rgba(212, 120, 90, 0.4);
        }

        /* Side Panel */
        .side-panel {
            position: fixed;
            top: 70px;
            right: 0;
            width: 320px;
            bottom: 0;
            background: var(--bg-darker);
            border-left: 1px solid var(--border);
            padding: 24px;
            overflow-y: auto;
            z-index: 90;
        }

        .panel-empty {
            text-align: center;
            color: var(--text-muted);
            margin-top: 60px;
        }

        .panel-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 600;
            color: white;
        }

        .panel-name {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
        }

        .panel-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .panel-section {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .panel-section:last-child {
            border-bottom: none;
        }

        .panel-section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-light);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 500;
            text-align: right;
        }

        .union-card {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .union-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .union-type {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(212, 120, 90, 0.2);
            color: var(--accent-light);
        }

        .union-partner {
            font-weight: 500;
            font-size: 14px;
        }

        .union-children {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .child-chip {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .child-chip:hover {
            background: rgba(212, 120, 90, 0.2);
        }

        /* Legend */
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 43, 38, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            z-index: 80;
        }

        .legend-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Search Results */
        .search-results {
            position: absolute;
            top: 46px;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            max-height: 240px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        .search-result-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        /* Zoom Controls */
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 340px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 80;
        }

        .zoom-controls .btn {
            width: 42px;
            height: 42px;
            padding: 0;
            justify-content: center;
            border-radius: 12px;
            font-size: 20px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .side-panel {
                width: 280px;
            }
            .main {
                right: 280px;
            }
            .zoom-controls {
                right: 300px;
            }
            .search-box input {
                width: 180px;
            }
        }

        @media (max-width: 700px) {
            .header {
                padding: 0 12px;
            }
            .brand-title {
                font-size: 16px;
            }
            .search-box {
                display: none;
            }
            .side-panel {
                transform: translateX(100%);
                transition: transform 0.3s;
            }
            .side-panel.open {
                transform: translateX(0);
            }
            .main {
                right: 0;
            }
            .zoom-controls {
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <div class="brand-logo">สย</div>
            <div class="brand-title">สายใยตระกูล</div>
        </div>
        <div class="header-actions">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="ค้นหาสมาชิกในครอบครัว..." autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>
            <button class="btn" id="btn-reset">⟲ รีเซ็ตมุมมอง</button>
            <button class="btn btn-primary" id="btn-add">+ เพิ่มสมาชิก</button>
        </div>
    </header>

    <main class="main" id="main-area">
        <div id="tree-canvas">
            <svg class="connections" id="connections"></svg>
            <div id="nodes-container"></div>
        </div>
    </main>

    <aside class="side-panel" id="side-panel">
        <div class="panel-empty">
            <div style="font-size: 48px; margin-bottom: 12px;">👨‍👩‍👧‍👦</div>
            <div>คลิกที่บุคคลในแผนผังเพื่อดูรายละเอียด</div>
        </div>
    </aside>

    <div class="legend">
        <div class="legend-title">สัญลักษณ์</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--male);"></div> ชาย</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--female);"></div> หญิง</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--accent);"></div> สมรส/คู่สมรส</div>
    </div>

    <div class="zoom-controls">
        <button class="btn" id="zoom-in">+</button>
        <button class="btn" id="zoom-out">−</button>
        <button class="btn" id="zoom-fit">⌂</button>
    </div>

    <script src="data.js"></script>
    <script src="tree.js"></script>
</body>
</html>
